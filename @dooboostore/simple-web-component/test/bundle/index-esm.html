<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ESM Bundle Test</title>
  </head>
  <body>
    <h1>ESM Bundle Test</h1>
    <p>Status: <strong id="status">running…</strong></p>
    <bundle-counter></bundle-counter>
    <script type="module">
      import { elementDefine, onConnectedBodyShadow, eventShadow, innerHtml, Core } from './node_modules/@dooboostore/simple-web-component/dist/esm-bundle/dooboostore-simple-web-component.esm.js';
      // 데코레이터 문법 없이 함수로 적용한다 (위 → 아래 순서로 적고, TS 처럼 아래부터 적용)
      const decorate = (Class, key, ...decorators) => {
        let desc = Object.getOwnPropertyDescriptor(Class.prototype, key);
        for (const d of [...decorators].reverse()) desc = d(Class.prototype, key, desc) || desc;
        Object.defineProperty(Class.prototype, key, desc);
      };

      class BundleCounter extends HTMLElement {
        count = 0;
        render() { return `<button class="inc">+1</button> <span class="out">0</span>`; }
        onInc() { this.count++; return String(this.count); }
      }
      decorate(BundleCounter, 'render', onConnectedBodyShadow); // bare
      decorate(BundleCounter, 'onInc', eventShadow('.inc', 'click'), innerHtml('.out'));
      elementDefine('bundle-counter', { window })(BundleCounter);

      // 스스로 확인: 두 번 클릭 → .out 이 2, Core 재export 도 보이는지
      setTimeout(() => {
        const el = document.querySelector('bundle-counter');
        const btn = el.shadowRoot?.querySelector('.inc');
        btn?.click(); btn?.click();
        const out = el.shadowRoot?.querySelector('.out')?.textContent;
        const ok = out === '2' && typeof Core === 'object';
        const status = document.getElementById('status');
        status.textContent = ok ? 'PASS' : `FAIL (out=${out}, Core=${typeof Core})`;
        status.style.color = ok ? 'green' : 'red';
      }, 100);
    </script>
  </body>
</html>
