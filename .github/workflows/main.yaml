name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      # ✅ corepack이 pnpm PATH 등록까지 확실히 해줌
      - name: Enable Corepack and install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: |
          pnpm --filter @dooboostore/dom-parser-test exec playwright install --with-deps chromium
          pnpm --filter @dooboostore/simple-web-component exec playwright install chromium
          pnpm --filter @dooboostore/simple-boot-http-server-ssr exec playwright install chromium

      - name: Build project
        run: pnpm run build

      - name: Test packages
        run: pnpm run all:test
